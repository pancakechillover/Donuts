<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="donut-hole">
      <rect width="100" height="100" fill="white" />
      <circle cx="50" cy="50" r="16" fill="black" />
    </mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Donut -->
    <circle cx="50" cy="50" r="40" fill="#EAB308" mask="url(#donut-hole)" />
    
    <!-- Frosting -->
    <path d="M50 10 C 70 10 90 25 90 45 C 90 55 82 62 75 62 C 68 62 65 55 58 55 C 50 55 45 61 38 61 C 30 61 25 52 18 52 C 12 52 10 40 10 40 C 10 25 30 10 50 10 Z" fill="#EC4899" mask="url(#donut-hole)" />
  </g>

  <!-- Sprinkles -->
  <g stroke-linecap="round" stroke-width="2.5">
    <line x1="30" y1="25" x2="35" y2="28" stroke="#60A5FA" />
    <line x1="65" y1="20" x2="68" y2="25" stroke="#FEF08A" />
    <line x1="75" y1="40" x2="70" y2="45" stroke="#34D399" />
    <line x1="45" y1="20" x2="50" y2="18" stroke="#F8FAFC" />
    <line x1="25" y1="40" x2="28" y2="35" stroke="#F8FAFC" />
    <line x1="82" y1="28" x2="85" y2="33" stroke="#F8FAFC" />
    <line x1="55" y1="35" x2="50" y2="32" stroke="#60A5FA" />
    <line x1="35" y1="52" x2="40" y2="55" stroke="#FEF08A" />
    <line x1="68" y1="55" x2="63" y2="52" stroke="#F8FAFC" />
  </g>

  <!-- Clock elements inside/over the hole -->
  <!-- Inner Rim -->
  <circle cx="50" cy="50" r="16" fill="#F8FAFC" stroke="#334155" stroke-width="2" />
  
  <!-- Clock Tick Marks -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round">
    <line x1="50" y1="36" x2="50" y2="38" />
    <line x1="50" y1="64" x2="50" y2="62" />
    <line x1="36" y1="50" x2="38" y2="50" />
    <line x1="64" y1="50" x2="62" y2="50" />
  </g>

  <!-- Clock Hands -->
  <circle cx="50" cy="50" r="3" fill="#334155" />
  <!-- Minute Hand (to ~1:00) -->
  <line x1="50" y1="50" x2="58" y2="30" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <!-- Hour Hand (to 4:00) -->
  <line x1="50" y1="50" x2="60" y2="58" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
  <!-- Second Hand (to 9:00) -->
  <line x1="50" y1="50" x2="32" y2="50" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="1" fill="#EF4444" />
</svg>
