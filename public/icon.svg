<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id=" donut_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AA2FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background for PWA icon standard -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  
  <!-- Donut Body -->
  <circle cx="256" cy="256" r="160" stroke="url(#donut_grad)" stroke-width="60" filter="url(#glow)" />
  
  <!-- "Donut Hole" / Clock Face -->
  <circle cx="256" cy="256" r="100" fill="#1E293B" stroke="#334155" stroke-width="4" />
  
  <!-- Clock Ticks -->
  <g stroke="#94A3B8" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="170" x2="256" y2="185" />
    <line x1="256" y1="327" x2="256" y2="342" />
    <line x1="170" y1="256" x2="185" y2="256" />
    <line x1="327" y1="256" x2="342" y2="256" />
  </g>
  
  <!-- Clock Hands -->
  <path d="M256 196V256L300 300" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="12" fill="white" />
  
  <!-- Accent dots on donut -->
  <circle cx="360" cy="180" r="8" fill="white" opacity="0.6" />
  <circle cx="150" cy="220" r="6" fill="white" opacity="0.4" />
  <circle cx="280" cy="380" r="10" fill="white" opacity="0.5" />
</svg>

